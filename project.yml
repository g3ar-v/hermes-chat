name: HermesChat
options:
  bundleIdPrefix: com.hermes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.hermes.chat
    INFOPLIST_FILE: HermesChat/Info.plist
    CODE_SIGN_ENTITLEMENTS: HermesChat/HermesChat.entitlements

schemes:
  HermesChat:
    build:
      targets:
        HermesChat: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView.git
    revision: 31e52d2

targets:
  HermesChat:
    type: application
    platform: macOS
    sources:
      - path: HermesChat/Sources
      - path: HermesChat/Resources
    dependencies:
      - package: KeyboardShortcuts
      - package: MarkdownView
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    entitlements:
      path: HermesChat/HermesChat.entitlements
